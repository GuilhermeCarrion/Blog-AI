services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_ia"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
